<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Casilla — Asistente fiscal IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#fbf7f1; --surface:#ffffff; --surface-2:#fbf7f2;
  --ink:#29231d; --ink-2:#73685d; --ink-3:#a99e92;
  --line:#ece3d8; --line-strong:#dccfc0;

  --accent:#e8590c; --accent-strong:#c2410c; --on-accent:#fff;
  --accent-soft:#fdf0e6; --accent-line:#f6d6bd;

  --ok:#157f5a; --ok-soft:#e7f3ec;
  --warn:#a8680b; --warn-soft:#fbefd9;
  --danger:#b3402b; --danger-soft:#fae7e1;

  --radius:11px; --radius-lg:16px; --radius-sm:8px; --radius-pill:999px;
  --shadow:0 1px 2px rgba(54,40,25,.05), 0 2px 8px rgba(54,40,25,.04);
  --shadow-lg:0 4px 14px rgba(54,40,25,.07), 0 16px 40px rgba(54,40,25,.08);
  --shadow-ring:0 0 0 1px var(--line);

  --u:1; /* density multiplier */
  --maxw:1240px;
  --font:"Hanken Grotesk", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, monospace;
  --border-w:1px;
  --label-tt:none; --label-ls:0; --label-w:600;
}

/* ===== Variante: Cálido ===== */
[data-variant="calido"]{
  --bg:#fbf3ea; --surface:#fffdfb; --surface-2:#fdf4ec;
  --line:#f0e2d2; --line-strong:#e6d3bf;
  --accent-soft:#fdeede;
  --radius:18px; --radius-lg:24px; --radius-sm:13px;
  --shadow:0 2px 6px rgba(120,70,20,.06), 0 6px 18px rgba(120,70,20,.06);
  --shadow-lg:0 8px 26px rgba(120,70,20,.10), 0 24px 60px rgba(120,70,20,.10);
}
/* ===== Variante: Estructurado ===== */
[data-variant="estructurado"]{
  --bg:#f6f1e9; --surface:#ffffff; --surface-2:#f6f1e8;
  --ink:#1f1b16; --line:#e2d7c7; --line-strong:#c9bba6;
  --radius:5px; --radius-lg:6px; --radius-sm:4px; --radius-pill:5px;
  --shadow:none; --shadow-lg:0 2px 0 var(--line-strong);
  --border-w:1.5px;
  --label-tt:uppercase; --label-ls:.06em; --label-w:700;
}

[data-density="compact"]{ --u:.8; }

*{ box-sizing:border-box; margin:0; padding:0; }
html,body{ height:100%; }
body{
  font-family:var(--font); background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  font-size:15px; line-height:1.5;
}
#root{ min-height:100%; }
::selection{ background:var(--accent-soft); }

/* ============ APP SHELL ============ */
.app{ min-height:100vh; display:flex; flex-direction:column; }
.appbar{
  position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:saturate(1.1) blur(10px); border-bottom:var(--border-w) solid var(--line);
}
.appbar-inner{
  max-width:var(--maxw); margin:0 auto; padding:calc(14px*var(--u)) 28px;
  display:flex; align-items:center; gap:20px;
}
.logo-mark{ color:var(--accent); display:inline-flex; }
.logo-word{ font-weight:800; font-size:19px; letter-spacing:-.02em; }
.appbar-nav{ display:flex; align-items:center; gap:4px; margin-left:8px; }
.navlink{
  display:flex; align-items:center; gap:7px; padding:8px 13px; border-radius:var(--radius-sm);
  color:var(--ink-2); font-weight:600; font-size:13.5px; cursor:pointer; border:none; background:none;
  font-family:inherit;
}
.navlink:hover{ background:var(--surface-2); color:var(--ink); }
.navlink.active{ background:var(--accent-soft); color:var(--accent-strong); }
.appbar-spacer{ flex:1; }

/* segmented variant switcher */
.seg{ display:flex; gap:3px; padding:3px; background:var(--surface-2); border:var(--border-w) solid var(--line);
  border-radius:var(--radius-pill); }
.seg button{
  font-family:inherit; border:none; background:none; cursor:pointer; padding:6px 13px;
  border-radius:var(--radius-pill); font-size:12.5px; font-weight:600; color:var(--ink-2); white-space:nowrap;
}
.seg button.on{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
[data-variant="estructurado"] .seg button.on{ background:var(--ink); color:var(--bg); box-shadow:none; }
.seg-label{ font-size:11px; font-weight:700; color:var(--ink-3); text-transform:uppercase; letter-spacing:.07em; margin-right:2px; }

.avatar{
  width:34px; height:34px; border-radius:var(--radius-pill); background:var(--accent-soft); color:var(--accent-strong);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px;
  border:var(--border-w) solid var(--accent-line);
}

/* ============ CONTENT ============ */
.main{ max-width:var(--maxw); margin:0 auto; padding:calc(34px*var(--u)) 28px calc(60px*var(--u)); width:100%; }
.page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:calc(26px*var(--u)); flex-wrap:wrap; }
.eyebrow{ font-size:12px; font-weight:700; color:var(--accent-strong); text-transform:uppercase; letter-spacing:.09em; margin-bottom:8px; display:flex; align-items:center; gap:7px; white-space:nowrap; }
h1.title{ font-size:clamp(26px,3vw,34px); font-weight:800; letter-spacing:-.025em; line-height:1.08; }
.subtitle{ color:var(--ink-2); margin-top:9px; font-size:15px; max-width:52ch; }

/* ============ BUTTONS ============ */
.btn{ font-family:inherit; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border-radius:var(--radius-sm); font-weight:650; cursor:pointer; border:var(--border-w) solid transparent;
  white-space:nowrap; transition:background .14s, border-color .14s, transform .05s, box-shadow .14s; }
.btn:active{ transform:translateY(.5px); }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn-md{ padding:10px 17px; font-size:14px; }
.btn-sm{ padding:7px 12px; font-size:13px; }
.btn-primary{ background:var(--accent); color:var(--on-accent); }
.btn-primary:hover:not(:disabled){ background:var(--accent-strong); }
.btn-secondary{ background:var(--surface); color:var(--ink); border-color:var(--line-strong); box-shadow:var(--shadow); }
.btn-secondary:hover:not(:disabled){ border-color:var(--ink-3); }
.btn-ghost{ background:transparent; color:var(--ink-2); }
.btn-ghost:hover:not(:disabled){ background:var(--surface-2); color:var(--ink); }
.btn-soft{ background:var(--accent-soft); color:var(--accent-strong); border-color:var(--accent-line); }
.btn-soft:hover:not(:disabled){ background:color-mix(in srgb,var(--accent-soft) 70%, var(--accent) 12%); }

/* ============ BADGES ============ */
.badge{ display:inline-flex; align-items:center; gap:5px; padding:4px 9px; border-radius:var(--radius-pill);
  font-size:12px; font-weight:650; line-height:1; border:1px solid transparent; white-space:nowrap; }
.badge-ok{ background:var(--ok-soft); color:var(--ok); }
.badge-warn{ background:var(--warn-soft); color:var(--warn); }
.badge-danger{ background:var(--danger-soft); color:var(--danger); }
.badge-accent{ background:var(--accent-soft); color:var(--accent-strong); }
.badge-muted{ background:var(--surface-2); color:var(--ink-2); border-color:var(--line); }
.badge-dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }

.conf{ display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:650; }
.conf svg{ width:8px; height:8px; }
.conf-ok{ color:var(--ok); } .conf-warn{ color:var(--warn); } .conf-danger{ color:var(--danger); }

/* ============ CARD ============ */
.card{ background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow); }

/* ============ DASHBOARD ============ */
.stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:calc(26px*var(--u)); }
.stat{ padding:18px 20px; background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
.stat-k{ font-size:12.5px; color:var(--ink-2); font-weight:600; display:flex; align-items:center; gap:7px; }
.stat-v{ font-size:30px; font-weight:800; letter-spacing:-.03em; margin-top:8px; }
.stat-v small{ font-size:14px; font-weight:600; color:var(--ink-3); margin-left:3px; }

.toolbar{ display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
.searchbox{ flex:1; min-width:200px; display:flex; align-items:center; gap:9px; padding:9px 14px;
  background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius-sm); color:var(--ink-3); box-shadow:var(--shadow); }
.searchbox input{ border:none; background:none; outline:none; font-family:inherit; font-size:14px; color:var(--ink); width:100%; }

.doc-list{ display:flex; flex-direction:column; }
.doc-list .card{ overflow:hidden; }
.doc-row{ display:grid; grid-template-columns:auto 1fr auto auto auto; align-items:center; gap:18px;
  padding:15px 20px; border-bottom:var(--border-w) solid var(--line); cursor:pointer; transition:background .12s; background:none; border-left:none; border-right:none; border-top:none; width:100%; text-align:left; font-family:inherit; }
.doc-row:last-child{ border-bottom:none; }
.doc-row:hover{ background:var(--surface-2); }
.doc-ico{ width:42px; height:42px; border-radius:var(--radius-sm); background:var(--accent-soft); color:var(--accent-strong);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; position:relative; }
.doc-ico b{ font-size:13px; font-weight:800; letter-spacing:-.02em; }
.doc-name{ font-weight:700; font-size:14.5px; letter-spacing:-.01em; }
.doc-meta{ color:var(--ink-2); font-size:12.5px; margin-top:3px; }
.doc-col{ font-size:13px; color:var(--ink-2); }
.doc-col b{ color:var(--ink); font-weight:650; }
.doc-prog{ display:flex; align-items:center; gap:8px; }
.bar{ width:74px; height:6px; border-radius:99px; background:var(--surface-2); overflow:hidden; border:1px solid var(--line); }
.bar > i{ display:block; height:100%; background:var(--accent); border-radius:99px; }
.chev{ color:var(--ink-3); }

/* ============ STEPPER ============ */
.wizard-head{ display:flex; align-items:center; gap:16px; margin-bottom:calc(30px*var(--u)); }
.stepper{ display:flex; align-items:center; gap:0; flex:1; }
.step{ display:flex; align-items:center; gap:10px; }
.step-dot{ width:30px; height:30px; border-radius:var(--radius-pill); border:2px solid var(--line-strong);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:var(--ink-3); background:var(--surface); flex-shrink:0; }
.step.active .step-dot{ border-color:var(--accent); color:var(--accent-strong); background:var(--accent-soft); }
.step.done .step-dot{ border-color:var(--accent); background:var(--accent); color:var(--on-accent); }
.step-label{ font-size:13px; font-weight:650; color:var(--ink-3); }
.step.active .step-label, .step.done .step-label{ color:var(--ink); }
.step-line{ width:34px; height:2px; background:var(--line-strong); margin:0 6px; flex-shrink:0; }
.step.done + .step-line, .step-line.filled{ background:var(--accent); }

/* ============ DROPZONE ============ */
.dropzone{ border:2px dashed var(--line-strong); border-radius:var(--radius-lg); background:var(--surface);
  padding:54px 32px; text-align:center; transition:border-color .15s, background .15s; cursor:pointer; }
.dropzone.drag{ border-color:var(--accent); background:var(--accent-soft); }
.dz-ico{ width:64px; height:64px; border-radius:var(--radius); background:var(--accent-soft); color:var(--accent-strong);
  display:flex; align-items:center; justify-content:center; margin:0 auto 18px; }
.dz-title{ font-size:19px; font-weight:750; letter-spacing:-.02em; }
.dz-sub{ color:var(--ink-2); margin-top:7px; font-size:14px; }
.dz-formats{ display:flex; gap:7px; justify-content:center; margin-top:18px; flex-wrap:wrap; }
.chip{ font-family:var(--mono); font-size:11.5px; color:var(--ink-2); background:var(--surface-2); border:1px solid var(--line);
  padding:4px 9px; border-radius:var(--radius-sm); }

.filecard{ display:flex; align-items:center; gap:14px; padding:14px 16px; background:var(--surface);
  border:var(--border-w) solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
.filecard .doc-ico{ width:40px; height:40px; }

/* ============ PROCESSING ============ */
.proc-wrap{ max-width:560px; margin:0 auto; }
.proc-ai{ width:74px; height:74px; border-radius:var(--radius-lg); margin:0 auto 22px; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #f0a04b)); color:#fff;
  box-shadow:0 8px 26px color-mix(in srgb, var(--accent) 36%, transparent); }
.proc-ai svg{ animation:spinSlow 4s linear infinite; }
@keyframes spinSlow{ to{ transform:rotate(360deg); } }
.pipe{ display:flex; flex-direction:column; gap:2px; margin-top:10px; }
.pipe-row{ display:flex; align-items:center; gap:14px; padding:13px 16px; border-radius:var(--radius); border:var(--border-w) solid transparent; }
.pipe-row.active{ background:var(--surface); border-color:var(--line); box-shadow:var(--shadow); }
.pipe-ico{ width:30px; height:30px; border-radius:var(--radius-pill); flex-shrink:0; display:flex; align-items:center; justify-content:center;
  border:2px solid var(--line-strong); color:var(--ink-3); background:var(--surface); }
.pipe-row.active .pipe-ico{ border-color:var(--accent); color:var(--accent); }
.pipe-row.done .pipe-ico{ border-color:var(--accent); background:var(--accent); color:#fff; }
.pipe-ico .spin{ animation:spinSlow 1.1s linear infinite; }
.pipe-label{ font-weight:650; font-size:14.5px; }
.pipe-row:not(.active):not(.done) .pipe-label{ color:var(--ink-3); }
.pipe-detail{ font-size:12.5px; color:var(--ink-2); margin-top:2px; }
.proc-bar{ height:8px; border-radius:99px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden; margin-top:24px; }
.proc-bar > i{ display:block; height:100%; background:var(--accent); transition:width .5s cubic-bezier(.4,0,.2,1); }

/* ============ REVIEW ============ */
.review-grid{ display:grid; grid-template-columns:1.05fr 1fr; gap:18px; align-items:start; }
@media (max-width:980px){ .review-grid{ grid-template-columns:1fr; } }
.panel{ background:var(--surface); border:var(--border-w) solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow); overflow:hidden; }
.panel-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:13px 16px; border-bottom:var(--border-w) solid var(--line); }
.panel-title{ font-weight:700; font-size:14px; display:flex; align-items:center; gap:9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.panel-body{ padding:18px; }
.tabs{ display:flex; gap:3px; padding:3px; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-pill); }
.tabs button{ font-family:inherit; border:none; background:none; cursor:pointer; padding:6px 12px; border-radius:var(--radius-pill);
  font-size:12.5px; font-weight:650; color:var(--ink-2); display:flex; align-items:center; gap:6px; }
.tabs button.on{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }

/* doc preview (faux PDF) */
.docview{ font-size:13px; max-height:560px; overflow:auto; }
.paper{ background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:26px 28px; }
.paper h4{ font-size:15px; font-weight:800; letter-spacing:-.01em; }
.paper .org{ color:var(--ink-2); font-size:12px; margin-top:2px; }
.paper hr{ border:none; border-top:1px solid var(--line); margin:16px 0; }
.frow{ display:flex; justify-content:space-between; gap:14px; padding:7px 0; border-bottom:1px dashed var(--line); }
.frow .lab{ color:var(--ink-2); }
.frow .val{ font-family:var(--mono); font-weight:600; }
.hl{ background:var(--accent-soft); box-shadow:0 0 0 3px var(--accent-soft); border-radius:3px; }

/* markdown view */
.md{ font-family:var(--mono); font-size:12.5px; line-height:1.7; white-space:pre-wrap; color:var(--ink);
  max-height:560px; overflow:auto; background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:18px 20px; }
.md .h1{ color:var(--accent-strong); font-weight:700; }
.md .h2{ color:var(--ink); font-weight:700; }
.md .q{ color:var(--ink-3); }
.md .b{ color:var(--ink); font-weight:700; }

/* fields */
.fgroup{ margin-bottom:18px; }
.fgroup:last-child{ margin-bottom:0; }
.fgroup-h{ font-size:11.5px; font-weight:700; color:var(--ink-2); text-transform:uppercase; letter-spacing:.07em; margin-bottom:9px; display:flex; align-items:center; gap:8px; }
.fgroup-h::after{ content:""; flex:1; height:1px; background:var(--line); }
.field{ display:grid; grid-template-columns:auto 1fr; gap:12px; padding:9px 0; align-items:start; }
.casilla{ width:34px; height:24px; border-radius:var(--radius-sm); background:var(--ink); color:var(--bg);
  display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:11px; font-weight:600; flex-shrink:0; margin-top:20px; }
.casilla.none{ background:transparent; color:transparent; }
.field-main{ min-width:0; }
.flabel{ font-size:12.5px; color:var(--ink-2); font-weight:600; display:flex; align-items:center; gap:8px; margin-bottom:5px; flex-wrap:wrap; }
.input{ display:flex; align-items:center; gap:8px; }
.input input{ font-family:inherit; font-size:14px; font-weight:600; color:var(--ink); padding:8px 11px; border-radius:var(--radius-sm);
  border:var(--border-w) solid var(--line-strong); background:var(--surface); width:100%; outline:none; transition:border-color .12s, box-shadow .12s; }
.input.num input{ font-family:var(--mono); text-align:right; }
.input input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.input .unit{ color:var(--ink-3); font-family:var(--mono); font-size:13px; }
.field.flagged .input input{ border-color:var(--danger); background:var(--danger-soft); }
.field-note{ display:flex; gap:7px; align-items:flex-start; font-size:12px; color:var(--danger); margin-top:7px; background:var(--danger-soft); padding:8px 10px; border-radius:var(--radius-sm); }
.ai-tag{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700; color:var(--accent-strong); }

.review-foot{ position:sticky; bottom:0; margin-top:22px; background:color-mix(in srgb,var(--bg) 88%, transparent); backdrop-filter:blur(8px);
  border-top:var(--border-w) solid var(--line); padding:14px 0; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; }

/* ============ SUCCESS ============ */
.done-wrap{ max-width:520px; margin:30px auto; text-align:center; }
.done-ico{ width:80px; height:80px; border-radius:var(--radius-pill); background:var(--ok-soft); color:var(--ok);
  display:flex; align-items:center; justify-content:center; margin:0 auto 22px; }
.done-card{ text-align:left; margin-top:26px; }
.done-row{ display:flex; align-items:center; justify-content:space-between; padding:13px 18px; border-bottom:var(--border-w) solid var(--line); }
.done-row:last-child{ border-bottom:none; }

/* ============ MISC ============ */
.empty-note{ color:var(--ink-3); font-size:12.5px; }
@media (max-width:680px){
  .appbar-nav{ display:none; }
  .doc-row{ grid-template-columns:auto 1fr auto; }
  .doc-col.hide-sm{ display:none; }
  .main{ padding-left:16px; padding-right:16px; }
  .appbar-inner{ padding-left:16px; padding-right:16px; }
}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="review.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
